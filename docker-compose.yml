# Minimal production-shaped stack: nginx in front of php-fpm.
#
# No database, cache or object-storage services are defined, because KayraPHP
# does not have those layers yet. Add them when the corresponding framework
# support lands, not before.

services:
  app:
    build:
      context: .
      target: runtime
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      LOG_CHANNEL: stderr
    volumes:
      - storage:/app/storage
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  storage:
