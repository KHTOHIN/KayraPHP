# ---------------------------------------------------------------------------
# Reading a failed run
#
# If EVERY job fails in about three seconds and the API reports no steps at
# all, the workflow is not what failed -- nothing in it ever executed. GitHub
# reports that state as an annotation on each job with no step output, and the
# usual cause is account-level: a billing lock, or an Actions policy that
# refuses one of the actions referenced below. Read the annotation before
# changing anything here:
#
#   gh run view --log-failed
#   gh api repos/:owner/:repo/check-runs/<job-id>/annotations
#
# A genuine workflow failure names a step and takes longer than the checkout.
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref — a queue of stale builds helps nobody.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ext/uri is deliberately absent from every `extensions:` list below: it is
# compiled into PHP 8.5 itself (ReflectionExtension reports version "8.5.0",
# tracking PHP rather than a package version), so listing it just sends
# setup-php looking for a PECL package that does not exist. That is noise
# rather than a failure — setup-php logs extension problems and continues — so
# the "Preflight" step below asserts ext/uri is actually loaded instead.
env:
  PHP_VERSION: '8.5'
  PHP_EXTENSIONS: mbstring, json, openssl, pdo_sqlite

jobs:
  # ---------------------------------------------------------------------------
  # The matrix exists to catch behaviour that depends on the runtime rather than
  # on the code: OPcache changes what is re-read per request, and Swoole changes
  # whether the container is serving one request or many at once.
  # ---------------------------------------------------------------------------
  tests:
    name: PHP 8.5 · opcache=${{ matrix.opcache }} · swoole=${{ matrix.swoole }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        opcache: ['off', 'on']
        swoole: ['off', 'on']

    steps:
      # Runs before any third-party action, so if the run dies immediately the
      # logs still show how far it got. A job that fails in a few seconds has
      # failed at checkout or at the first action, not at the tests.
      - name: Preflight
        run: |
          echo "runner=$RUNNER_OS  event=$GITHUB_EVENT_NAME  ref=$GITHUB_REF"
          echo "repo=$GITHUB_REPOSITORY  sha=$GITHUB_SHA"
          php --version || echo "no php on PATH yet (expected before setup-php)"

      - uses: actions/checkout@v4

      - name: Confirm the checkout looks like this project
        run: |
          test -f composer.json || { echo "composer.json missing"; exit 1; }
          test -f composer.lock || { echo "composer.lock missing — commit it"; exit 1; }
          test -f kayra || { echo "kayra entry point missing"; exit 1; }
          echo "checkout ok"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          # One line: a folded block would insert spaces after each comma.
          ini-values: opcache.enable_cli=${{ matrix.opcache == 'on' && 1 || 0 }},opcache.jit=${{ matrix.opcache == 'on' && 'tracing' || 'disable' }},opcache.jit_buffer_size=64M,zend.assertions=1
          coverage: none
          tools: composer:v2

      # Separate and tolerant: Swoole may not have a build for the newest PHP
      # yet. The suite does not require it — the coroutine-isolation tests use
      # Fibers, which are always available — so a missing build must not fail
      # the run. The report below states what actually loaded.
      - name: Try to install Swoole
        if: matrix.swoole == 'on'
        continue-on-error: true
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}, swoole
          ini-values: opcache.enable_cli=${{ matrix.opcache == 'on' && 1 || 0 }},opcache.jit=${{ matrix.opcache == 'on' && 'tracing' || 'disable' }},opcache.jit_buffer_size=64M,zend.assertions=1
          coverage: none
          tools: composer:v2

      - name: Runtime report
        run: |
          php -r '
            printf(
              "php=%s opcache=%d jit=%s swoole=%d uri=%d%s",
              PHP_VERSION,
              (int) function_exists("opcache_get_status"),
              (string) ini_get("opcache.jit"),
              (int) extension_loaded("swoole"),
              (int) extension_loaded("uri"),
              PHP_EOL
            );
          '
          # ext/uri is the one extension the framework cannot fall back from in
          # the way it claims to, so assert it rather than discovering it later.
          php -r 'exit(extension_loaded("uri") ? 0 : 1);' || {
            echo "::error::ext/uri is not loaded. It is built into PHP 8.5; a build without it is not supported."
            exit 1
          }

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ env.PHP_VERSION }}-

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Unit and feature tests
        run: vendor/bin/phpunit --colors=always

      - name: PSR-7 conformance
        run: vendor/bin/phpunit -c phpunit-psr7.xml --colors=always

      # The compiled artefacts change which code path serves a request, so the
      # whole suite runs again against them.
      - name: Build compiled artefacts
        run: php kayra optimize

      - name: Tests against the compiled build
        run: vendor/bin/phpunit --colors=always

      - name: Environment report
        run: php kayra doctor

  static-analysis:
    name: PHPStan (level 9)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --no-progress --prefer-dist

      # The baseline may shrink but never grow: any new error fails the build.
      - run: vendor/bin/phpstan analyse --no-progress --error-format=github

  mutation-testing:
    name: Infection
    runs-on: ubuntu-latest
    # Slow, and advisory on a pull request. Gate it on main.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # Advisory until a real MSI baseline exists. The thresholds in
    # infection.json5 were chosen, not measured; this job reports the true score
    # without failing the build on a number nobody has verified yet. Flip this
    # off once the first run establishes the real figure.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          # Infection needs a coverage driver; pcov is far faster than xdebug.
          coverage: pcov
          tools: composer:v2

      - run: composer install --no-interaction --no-progress --prefer-dist

      - run: vendor/bin/infection --threads=max --no-progress --no-interaction

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infection-log
          path: storage/framework/infection.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # What a deploy actually runs. Every other job installs dev dependencies, so
  # none of them would notice a `require-dev` package being used from core/, or
  # `kayra optimize` depending on the test autoloader. This one would.
  # ---------------------------------------------------------------------------
  production-install:
    name: Production install (--no-dev)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          ini-values: opcache.enable_cli=1,opcache.jit=tracing,opcache.jit_buffer_size=64M
          coverage: none
          tools: composer:v2

      - name: Install without dev dependencies
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Configure
        run: |
          cp .env.example .env
          php kayra key:generate

      - name: Build for production
        env:
          APP_ENV: production
          APP_DEBUG: 'false'
        run: php kayra optimize

      # Booting is the assertion. A missing dev dependency, a class the compiler
      # could not resolve, or a template that only compiles under the test
      # autoloader all surface here and nowhere else.
      - name: Serve the compiled build and check it answers
        env:
          APP_ENV: production
          APP_DEBUG: 'false'
        run: |
          php -S 127.0.0.1:8000 -t public public/index.php &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8000/health && break
            sleep 1
          done

          failed=0
          for path in / /health /docs /login /register; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8000$path")
            printf '%-12s %s\n' "$path" "$code"
            [ "$code" = "200" ] || failed=1
          done

          # Debug output in a production build would leak stack traces.
          if curl -s http://127.0.0.1:8000/no-such-route | grep -qi 'stack trace'; then
            echo "::error::A production build rendered a stack trace on a 404."
            failed=1
          fi

          exit $failed

      - name: Environment report
        run: php kayra doctor --security

  security:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --no-progress --prefer-dist

      # Audit what is actually pinned, not what could resolve today.
      - run: composer audit --locked --no-interaction
