name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref — a queue of stale builds helps nobody.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # The matrix exists to catch behaviour that depends on the runtime rather than
  # on the code: OPcache changes what is re-read per request, and Swoole changes
  # whether the container is serving one request or many at once.
  # ---------------------------------------------------------------------------
  tests:
    name: PHP ${{ matrix.php }} · opcache=${{ matrix.opcache }} · swoole=${{ matrix.swoole }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
        opcache: ['off', 'on']
        swoole: ['off', 'on']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json, openssl, uri, pdo_sqlite ${{ matrix.swoole == 'on' && ', swoole' || '' }}
          ini-values: >-
            opcache.enable_cli=${{ matrix.opcache == 'on' && '1' || '0' }},
            opcache.jit=${{ matrix.opcache == 'on' && 'tracing' || 'disable' }},
            opcache.jit_buffer_size=64M,
            zend.assertions=1
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Confirm the runtime really is what the matrix claims
        run: |
          php -r 'printf("opcache=%d swoole=%d uri=%d\n",
            (int) function_exists("opcache_get_status"),
            (int) extension_loaded("swoole"),
            (int) extension_loaded("uri"));'

      - name: Unit and feature tests
        run: vendor/bin/phpunit --colors=always

      - name: PSR-7 conformance
        run: vendor/bin/phpunit -c phpunit-psr7.xml --colors=always

      # The compiled artefacts change which code path serves a request, so the
      # whole suite runs again against them.
      - name: Build compiled artefacts
        run: php kayra optimize

      - name: Tests against the compiled build
        run: vendor/bin/phpunit --colors=always

      - name: Environment report
        run: php kayra doctor

  static-analysis:
    name: PHPStan (level 9)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, json, openssl, uri
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --no-progress --prefer-dist

      # The baseline may shrink but never grow: any new error fails the build.
      - run: vendor/bin/phpstan analyse --no-progress --error-format=github

  mutation-testing:
    name: Infection
    runs-on: ubuntu-latest
    # Slow, and its verdict is advisory on a pull request. Gate it on main.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, json, openssl, uri
          # Infection needs a coverage driver; pcov is far faster than xdebug.
          coverage: pcov
          tools: composer:v2

      - run: composer install --no-interaction --no-progress --prefer-dist

      - run: vendor/bin/infection --threads=max --no-progress --no-interaction

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infection-log
          path: storage/framework/infection.log
          if-no-files-found: ignore

  security:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, json, openssl, uri
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer audit --no-interaction
