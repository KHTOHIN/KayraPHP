server {
    listen 80;
    server_name _;

    root /app/public;
    index index.php;

    charset utf-8;

    # Do not advertise the nginx version.
    server_tokens off;

    client_max_body_size 16m;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Everything that is not a real file goes to the front controller.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Only index.php is executable. Without this, any uploaded .php file that
    # lands under the web root becomes remote code execution.
    location = /index.php {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ {
        return 404;
    }

    # Never serve dotfiles.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(css|js|mjs|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/xml image/svg+xml;
}
